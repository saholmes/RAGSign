[project]
name = "rag-sign"
version = "0.1.0"
description = "Cryptographic authentication for RAG-enabled LLMs (RAG Sign reference implementation)"
authors = [
    {name = "Stephen Holmes", email = "s.a.holmes@surrey.ac.uk"},
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = [
    "rag", "llm", "cryptography", "digital-signatures",
    "fuzzy-extractor", "lsh", "hsm", "ai-security",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    # Cryptography core
    "cryptography>=43.0",        # ECDSA, SHA3, X.509
    # LSH and embeddings
    "datasketch>=1.6",           # MinHashLSH (more actively maintained than sklearn equivalent)
    "numpy>=1.26",
    # Error-correcting codes (BCH for the fuzzy extractor)
    "galois>=0.4",
    # Vector database
    "chromadb>=0.5",
    # Server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
hsm = [
    "python-pkcs11>=0.7",        # SoftHSM / real HSM via PKCS#11
]
llm = [
    "llama-cpp-python>=0.3",     # Llama 3.2 inference
]
embeddings = [
    "sentence-transformers>=3.0",  # OSS embeddings (bge-large, etc.)
]
openai = [
    "openai>=1.40",              # If using OpenAI text-embedding-3-* per paper
]
pdf = [
    "pypdf>=4.0",                # PDF→text for the IACR ePrint experiment scripts
]
cloud = [
    "boto3>=1.34",               # S3-compatible client for Cloudflare R2 sync
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
all = [
    "rag-sign[hsm,llm,embeddings,openai,dev]",
]

[project.scripts]
rag-sign-bench = "rag_sign.cli:bench_main"
rag-sign-server = "rag_sign.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_sign"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4"]
ignore = ["E501"]   # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
# Cryptographic notation: R = extracted key, P = helper data, etc.,
# match Dodis et al. exactly — keeping the case faithful to the paper
# is more valuable than enforcing snake_case for these specific
# variables.  FuzzyExtractFailure is a domain-specific exception name.
"src/rag_sign/fuzzy_extractor.py" = ["N802", "N818"]
"src/rag_sign/rag.py"             = ["N818"]
"src/rag_sign/regulator.py"       = ["N818"]
"tests/test_*.py"                 = ["N802", "N806"]
"scripts/iacr_experiment.py"      = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
